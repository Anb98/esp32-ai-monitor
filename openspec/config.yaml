schema: "1.0.0"
project: "esp32-ai-monitor"
mode: "hybrid"
strict_tdd: true

context:
  name: "ESP32-S3-Touch-AMOLED-2.16 AI Monitor"
  description: "Real-time AI quota and status monitor for Claude Code & Antigravity Desktop on ESP32-S3 AMOLED hardware."
  workspace: "E:/Projects/esp32-ai-monitor"
  
  components:
    backend:
      type: "service"
      language: "go"
      version: "1.26.4"
      runtime: "docker"
      strict_tdd: true
      test_runner: "go test ./..."
      memory_budget: "< 10MB RAM"
      endpoints:
        - "GET /api/dashboard"
      credential_mounts:
        - "~/.claude"
        - "~/.gemini"
        
    firmware:
      type: "embedded"
      language: "c/c++"
      framework: "ESP-IDF / PlatformIO"
      gui_library: "LVGL 8/9"
      hardware:
        mcu: "ESP32-S3R8 (16MB Flash, 8MB PSRAM, 2.4GHz Wi-Fi)"
        display: "2.16\" 480x480 AMOLED (CO5300 QSPI)"
        touch: "CST9220 Capacitive Touch (I2C)"
        imu: "QMI8658 6-axis IMU (auto-rotation 0/90/180/270 deg, 300ms debounce)"
        audio: "ES8311 I2S Audio Codec (status alert tones & recovery chimes)"
        pmic: "AXP2101 PMIC (Screen Suspend/Wake toggle on BOOT/GPIO0)"

paths:
  specs: "openspec/specs"
  changes: "openspec/changes"
  archive: "openspec/changes/archive"

rules:
  strict_tdd: true
  testing:
    backend: "go test ./..."
    coverage_threshold: 80
